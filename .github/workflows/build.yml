name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AutoEdit.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoEdit-apk
          path: out/AutoEdit.apk

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/AutoEdit.apk \
            --target "${{ github.sha }}" \
            --title "AutoEdit $TAG" \
            --notes "Автосборка из ветки \`${{ github.ref_name }}\` (commit ${{ github.sha }}).

          Скачай **AutoEdit.apk** на телефон и установи (нужно разрешить установку из неизвестных источников)."
          # Rolling "latest" tag so the download link never changes
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest out/AutoEdit.apk \
            --target "${{ github.sha }}" \
            --title "AutoEdit (последняя сборка)" \
            --notes "Всегда самая свежая сборка. Прямая ссылка: https://github.com/${{ github.repository }}/releases/download/latest/AutoEdit.apk"
